  name: tugasakhir
  description: "Aplikasi Smart Coffee Shop Kopiskuy"
  publish_to: 'none'
  version: 0.1.0+1

  environment:
    sdk: ">=3.0.0 <4.0.0"

  dependencies:
    flutter:
      sdk: flutter

    # HTTP Request API Backend
    dio: ^5.4.0

    # Session / Token Login
    shared_preferences: ^2.2.2

    # Local Database
    hive: ^2.2.3
    hive_flutter: ^1.1.0

    # Login Biometric
    local_auth: ^2.1.8

    # Animation
    lottie: ^3.1.0

    # Sensor
    sensors_plus: ^4.0.2

    # Location & Maps
    flutter_map: ^6.0.0
    latlong2: ^0.9.0
    geolocator: ^11.0.0
    http: ^1.2.1
    # Notification
    flutter_local_notifications: ^17.1.2

    # UI
    intl: ^0.19.0
    cupertino_icons: ^1.0.6
    image_picker: ^1.0.7
    carousel_slider: ^5.0.0
    flutter_animate: ^4.5.0

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0
    build_runner: ^2.4.8
    hive_generator: ^2.0.1

  flutter:
    uses-material-design: true

    assets:
      - assets/images/
      - assets/icons/
      - assets/lottie/